<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Ayan Khan — Software Developer | Full-Stack &amp; C++ Projects</title>
    <meta
      name="description"
      content="Portfolio of Ayan Khan, a student software developer building full-stack applications, browser tools, and modular C++ systems while studying Machine Learning and Data Science."
    />

    <!-- Canonical URL. Kept in sync with site.url in src/data/portfolio.ts,
         public/robots.txt and public/sitemap.xml. -->
    <link rel="canonical" href="https://ayankhan.me/" />

    <!-- Favicon. The ?v= query busts the browser cache when the icon changes. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=3" />
    <link rel="apple-touch-icon" href="/apple-icon.png?v=3" />
    
    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta
      property="og:title"
      content="Ayan Khan — Software Developer | Full-Stack &amp; C++ Projects"
    />
    <meta
      property="og:description"
      content="Portfolio of Ayan Khan, a student software developer building full-stack applications, browser tools, and modular C++ systems while studying Machine Learning and Data Science."
    />
    <meta property="og:url" content="https://ayankhan.me/" />
    <meta property="og:site_name" content="Ayan Khan" />
    <meta property="og:image" content="https://ayankhan.me/og-image.png?v=3" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Ayan Khan — Software Developer. Portfolio preview card."
    />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Ayan Khan — Software Developer | Full-Stack &amp; C++ Projects"
    />
    <meta
      name="twitter:description"
      content="Portfolio of Ayan Khan, a student software developer building full-stack applications, browser tools, and modular C++ systems while studying Machine Learning and Data Science."
    />
    <meta name="twitter:image" content="https://ayankhan.me/og-image.png?v=3" />

    <!-- Person structured data (JSON-LD) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Ayan Khan",
        "jobTitle": "Student Software Developer",
        "description": "Student software developer building full-stack applications, browser tools, and modular C++ systems while studying Machine Learning and Data Science.",
        "url": "https://ayankhan.me/",
        "sameAs": [
          "https://www.linkedin.com/in/the-ayan-khan/",
          "https://github.com/ThunderKhan"
        ],
        "affiliation": {
          "@type": "CollegeOrUniversity",
          "name": "Deen Dayal Upadhyaya Gorakhpur University"
        },
        "address": {
          "@type": "PostalAddress",
          "addressCountry": "IN"
        }
      }
    </script>

    <!-- Fonts: Manrope (headings + body) + IBM Plex Mono (technical details) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <!-- Set theme before first paint to avoid a flash of the wrong theme.
         Respects saved preference in localStorage, then the system theme. -->
    <script>
      ;(function () {
        try {
          var stored = localStorage.getItem('theme')
          var systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches
          var dark = stored === 'dark' || (stored !== 'light' && systemDark)
          if (dark) document.documentElement.classList.add('dark')
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
