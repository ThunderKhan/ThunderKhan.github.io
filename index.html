<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Ayan Khan — Software Developer &amp; BCA ML/DS Student</title>
    <meta
      name="description"
      content="Portfolio of Ayan Khan, a BCA Machine Learning and Data Science student building projects in software development, open source, and applied machine learning."
    />

    <!-- Canonical URL: replace GITHUB_USERNAME with your GitHub username -->
    <link rel="canonical" href="https://ThunderKhan.github.io/" />

    <!-- Favicon (placeholder — replace public/favicon.svg with your own if desired) -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Ayan Khan — Software Developer &amp; BCA ML/DS Student" />
    <meta
      property="og:description"
      content="Portfolio of Ayan Khan, a BCA Machine Learning and Data Science student building projects in software development, open source, and applied machine learning."
    />
    <meta property="og:url" content="https://ThunderKhan.github.io/" />
    <meta property="og:site_name" content="Ayan Khan" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Ayan Khan — Software Developer &amp; BCA ML/DS Student" />
    <meta
      name="twitter:description"
      content="Portfolio of Ayan Khan, a BCA Machine Learning and Data Science student building projects in software development, open source, and applied machine learning."
    />

    <!-- Person structured data (JSON-LD) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Ayan Khan",
        "jobTitle": "Software Developer in the Making",
        "description": "BCA student specializing in Machine Learning and Data Science, building foundations in software development, problem-solving, open source, and applied machine learning.",
        "url": "https://ThunderKhan.github.io/",
        "sameAs": [
          "https://www.linkedin.com/in/the-ayan-khan/",
          "https://github.com/ThunderKhan"
        ],
        "alumniOf": {
          "@type": "CollegeOrUniversity",
          "name": "Deen Dayal Upadhyaya Gorakhpur University"
        },
        "address": {
          "@type": "PostalAddress",
          "addressCountry": "IN"
        }
      }
    </script>

    <!-- Fonts: Newsreader (headings) + Inter (body) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&display=swap"
      rel="stylesheet"
    />

    <!-- Set theme before first paint to avoid a flash of the wrong theme.
         Respects saved preference in localStorage, then the system theme. -->
    <script>
      ;(function () {
        try {
          var stored = localStorage.getItem('theme')
          var systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches
          var dark = stored === 'dark' || (stored !== 'light' && systemDark)
          if (dark) document.documentElement.classList.add('dark')
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
