name: Portfolio CI

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Lint source
        run: npm run lint

      - name: Test blog utilities
        run: npm test

      - name: Generate GitHub contribution data
        run: node scripts/fetch-github-contributions.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build website
        run: npm run build

      - name: Verify generated build
        run: npm run test:build

      - name: Check links
        run: npm run check:links

      - name: Run Lighthouse audit
        shell: bash
        run: |
          npm run preview -- --host 127.0.0.1 --strictPort > /tmp/portfolio-preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill "$PREVIEW_PID" 2>/dev/null || true' EXIT

          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              cat /tmp/portfolio-preview.log
              exit 1
            fi
            sleep 1
          done

          LIGHTHOUSE_EXIT=0
          npx --yes lighthouse@12.8.2 http://127.0.0.1:4173/ \
            --preset=desktop \
            --chrome-flags="--headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --disable-background-timer-throttling --disable-backgrounding-occluded-windows --disable-renderer-backgrounding" \
            --only-categories=performance,accessibility,best-practices,seo \
            --output=json \
            --output-path=./lighthouse-report.json || LIGHTHOUSE_EXIT=$?

          if [ -f lighthouse-report.json ]; then
            node scripts/print-lighthouse-summary.mjs lighthouse-report.json
          fi

          exit "$LIGHTHOUSE_EXIT"

      - name: Upload Lighthouse report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: lighthouse-report.json
