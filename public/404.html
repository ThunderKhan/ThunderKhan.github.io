<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Page not found — Ayan Khan</title>
    <script>
      // GitHub Pages serves this file for client-side routes. Send blog routes
      // through the SPA entry point once, preserving the clean URL afterward.
      if (window.location.pathname === '/blog' || window.location.pathname.startsWith('/blog/')) {
        window.location.replace('/?path=' + encodeURIComponent(window.location.pathname))
      }
    </script>
    <style>
      :root {
        color-scheme: light dark;
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #07070b;
        color: #f4f1ff;
      }
      * { box-sizing: border-box; }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        background:
          radial-gradient(circle at 30% 20%, rgba(167,139,250,.15), transparent 35%),
          radial-gradient(circle at 75% 80%, rgba(251,113,133,.10), transparent 30%),
          #07070b;
      }
      main {
        width: min(100%, 520px);
        padding: 36px;
        border: 1px solid rgba(167,139,250,.18);
        border-radius: 20px;
        background: rgba(14,14,22,.82);
        text-align: center;
      }
      code { color: #a78bfa; }
      h1 { margin: 12px 0; font-size: clamp(2rem, 7vw, 3rem); letter-spacing: -.04em; }
      p { color: #a9a3b8; line-height: 1.7; }
      a {
        display: inline-flex;
        margin-top: 14px;
        padding: 11px 18px;
        border-radius: 999px;
        background: #a78bfa;
        color: #07070b;
        font-weight: 700;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <code>404 · route_not_found</code>
      <h1>This page wandered off.</h1>
      <p>The address does not exist on this portfolio, or it may have moved.</p>
      <a href="/">Back to portfolio</a>
    </main>
  </body>
</html>
