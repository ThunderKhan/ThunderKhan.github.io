<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Page not found — Ayan Khan</title>
    <style>
      :root {
        --bg: #f7f5fa;
        --fg: #1a1625;
        --card: #ffffff;
        --muted: #5c556b;
        --violet: #6d28d9;
        --coral: #c5344f;
        --border: rgba(109, 40, 217, 0.16);
        --grid: rgba(109, 40, 217, 0.06);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #07070b;
          --fg: #f4f1ff;
          --card: #0e0e16;
          --muted: #a9a3b8;
          --violet: #a78bfa;
          --coral: #fb7185;
          --border: rgba(167, 139, 250, 0.18);
          --grid: rgba(167, 139, 250, 0.05);
        }
      }

      * { box-sizing: border-box; margin: 0; padding: 0; }

      html, body { max-width: 100%; overflow-x: hidden; }

      body {
        background: var(--bg);
        color: var(--fg);
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        min-height: 100vh;
        min-height: 100svh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
        position: relative;
        line-height: 1.6;
      }

      /* Ambient background treatment */
      .bg {
        position: fixed;
        inset: 0;
        z-index: 0;
        overflow: hidden;
        pointer-events: none;
      }
      .bg .grid {
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(to right, var(--grid) 1px, transparent 1px),
          linear-gradient(to bottom, var(--grid) 1px, transparent 1px);
        background-size: 44px 44px;
        mask-image: radial-gradient(circle at 50% 42%, #000 0%, transparent 72%);
        -webkit-mask-image: radial-gradient(circle at 50% 42%, #000 0%, transparent 72%);
      }
      .bg .glow {
        position: absolute;
        border-radius: 50%;
        filter: blur(70px);
        opacity: 0.5;
      }
      .bg .glow-violet {
        width: 460px; height: 460px;
        top: -140px; left: 50%;
        transform: translateX(-60%);
        background: radial-gradient(circle, var(--violet), transparent 68%);
      }
      .bg .glow-coral {
        width: 380px; height: 380px;
        bottom: -130px; right: 50%;
        transform: translateX(60%);
        background: radial-gradient(circle, var(--coral), transparent 68%);
        opacity: 0.38;
      }
      /* Orbit / route-line motif */
      .bg .orbit {
        position: absolute;
        top: 42%;
        left: 50%;
        width: 620px;
        height: 620px;
        max-width: 150vw;
        max-height: 150vw;
        transform: translate(-50%, -50%);
      }
      .bg .orbit circle, .bg .orbit line {
        fill: none;
        stroke: var(--border);
        stroke-width: 1;
      }
      .bg .orbit .node {
        fill: var(--coral);
        stroke: none;
        transform-origin: 310px 310px;
        animation: spin 22s linear infinite;
      }
      .bg .orbit .node2 {
        fill: var(--violet);
        stroke: none;
        transform-origin: 310px 310px;
        animation: spin 16s linear infinite reverse;
      }
      @keyframes spin { to { transform: rotate(360deg); } }

      main {
        position: relative;
        z-index: 1;
        max-width: 30rem;
        width: 100%;
        text-align: center;
        background: color-mix(in srgb, var(--card) 82%, transparent);
        border: 1px solid var(--border);
        border-radius: 1.25rem;
        padding: 2.5rem 1.75rem;
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
      }

      .eyebrow {
        display: inline-block;
        font-family: ui-monospace, "IBM Plex Mono", SFMono-Regular, Menlo, monospace;
        font-size: 0.7rem;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: var(--violet);
        border: 1px solid var(--border);
        border-radius: 999px;
        padding: 0.35rem 0.75rem;
      }
      h1 {
        font-size: clamp(1.75rem, 6vw, 2.4rem);
        font-weight: 800;
        letter-spacing: -0.02em;
        margin-top: 1.1rem;
        text-wrap: balance;
      }
      h1 .accent { color: var(--coral); }
      p.message {
        color: var(--muted);
        margin-top: 0.85rem;
        font-size: 0.975rem;
        text-wrap: pretty;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: center;
        gap: 0.9rem 1.25rem;
        margin-top: 1.9rem;
      }
      a {
        text-decoration: none;
        transition: transform 0.15s ease, background 0.15s ease, color 0.15s ease, border-color 0.15s ease, opacity 0.15s ease;
      }
      a:focus-visible {
        outline: 2px solid var(--violet);
        outline-offset: 3px;
        border-radius: 0.7rem;
      }
      .home {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        min-height: 44px;
        min-width: 44px;
        padding: 0.75rem 1.5rem;
        border-radius: 0.7rem;
        background: var(--violet);
        color: #ffffff;
        font-size: 0.95rem;
        font-weight: 600;
      }
      @media (prefers-color-scheme: dark) {
        .home { color: #0e0e16; }
      }
      .home:hover { transform: translateY(-2px); opacity: 0.92; }
      .ghost {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.4rem;
        min-height: 44px;
        padding: 0.75rem 0.75rem;
        color: var(--muted);
        font-size: 0.9rem;
        font-weight: 500;
      }
      .ghost:hover { color: var(--coral); }
      .ghost svg { width: 16px; height: 16px; }

      @media (prefers-reduced-motion: reduce) {
        .bg .node, .bg .node2 { animation: none; }
        a:hover { transform: none; }
      }
    </style>
  </head>
  <body>
    <div class="bg" aria-hidden="true">
      <div class="grid"></div>
      <div class="glow glow-violet"></div>
      <div class="glow glow-coral"></div>
      <svg class="orbit" viewBox="0 0 620 620" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="310" cy="310" r="150" />
        <circle cx="310" cy="310" r="230" />
        <circle cx="310" cy="310" r="300" />
        <circle class="node" cx="310" cy="160" r="5" />
        <circle class="node2" cx="310" cy="80" r="4" />
      </svg>
    </div>

    <main>
      <span class="eyebrow">404 · Route not found</span>
      <h1>This page <span class="accent">wandered off.</span></h1>
      <p class="message">
        The address you followed doesn&rsquo;t exist on this portfolio. It may have
        been moved, renamed, or never existed at all. Let&rsquo;s get you back on route.
      </p>
      <div class="actions">
        <a class="home" href="/">Back to portfolio</a>
        <a
          class="ghost"
          href="https://github.com/ThunderKhan"
          target="_blank"
          rel="noopener noreferrer"
        >
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M12 .5A11.5 11.5 0 0 0 .5 12a11.5 11.5 0 0 0 7.86 10.92c.575.106.785-.25.785-.556 0-.274-.01-1-.015-1.965-3.196.695-3.87-1.54-3.87-1.54-.523-1.33-1.278-1.685-1.278-1.685-1.044-.714.08-.7.08-.7 1.155.082 1.763 1.186 1.763 1.186 1.026 1.758 2.693 1.25 3.35.955.104-.743.401-1.25.73-1.538-2.552-.29-5.236-1.276-5.236-5.68 0-1.255.448-2.28 1.184-3.084-.119-.29-.513-1.46.112-3.043 0 0 .966-.31 3.165 1.178a10.98 10.98 0 0 1 2.882-.388c.978.004 1.963.132 2.882.388 2.198-1.489 3.163-1.178 3.163-1.178.626 1.584.232 2.753.114 3.043.738.804 1.183 1.829 1.183 3.084 0 4.415-2.688 5.386-5.248 5.671.413.356.78 1.057.78 2.13 0 1.538-.014 2.777-.014 3.156 0 .308.207.668.79.554A11.5 11.5 0 0 0 23.5 12 11.5 11.5 0 0 0 12 .5Z" />
          </svg>
          GitHub profile
        </a>
      </div>
    </main>
  </body>
</html>
