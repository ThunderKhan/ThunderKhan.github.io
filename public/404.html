<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Page not found — Ayan Khan</title>
    <style>
      :root {
        --bg: #fafaf8;
        --fg: #2b2d36;
        --muted: #6b6e7c;
        --accent: #3b6ea5;
        --border: #e3e3df;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #17181f;
          --fg: #e6e6e3;
          --muted: #9a9daa;
          --accent: #7aa5d2;
          --border: #33353f;
        }
      }
      * { box-sizing: border-box; margin: 0; }
      body {
        background: var(--bg);
        color: var(--fg);
        font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
      }
      main { max-width: 28rem; text-align: center; }
      p.code {
        font-family: ui-monospace, monospace;
        font-size: 0.75rem;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: var(--accent);
      }
      h1 { font-family: Georgia, serif; font-size: 2rem; font-weight: 500; margin-top: 0.75rem; }
      p.message { color: var(--muted); line-height: 1.6; margin-top: 0.75rem; }
      a.home {
        display: inline-block;
        margin-top: 1.5rem;
        padding: 0.625rem 1.25rem;
        border: 1px solid var(--border);
        border-radius: 0.375rem;
        color: var(--fg);
        text-decoration: none;
        font-size: 0.875rem;
        transition: border-color 0.15s, color 0.15s;
      }
      a.home:hover, a.home:focus-visible { border-color: var(--accent); color: var(--accent); }
    </style>
  </head>
  <body>
    <main>
      <p class="code">404</p>
      <h1>Page not found</h1>
      <p class="message">
        This site is a single page, so the address you followed doesn&rsquo;t exist.
        Everything lives on the homepage.
      </p>
      <a class="home" href="/">Back to the homepage</a>
    </main>
  </body>
</html>
